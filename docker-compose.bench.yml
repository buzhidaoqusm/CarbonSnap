# Load-test overlay: points the api at the fake provider and keeps benchmark
# data in its own volumes (uploads and the postgres data directory), so
# hundreds of throwaway accounts never reach the dev database.
#
#   docker compose -f docker-compose.yml -f docker-compose.bench.yml --profile bench up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.bench.yml --profile bench down
#   docker volume rm carbonsnap_bench-data carbonsnap_bench-postgres-data
#
# Not `down -v`: that also deletes postgres-data, the dev database.
# See docs/benchmarks.md.

services:
  api:
    environment:
      LLM_PROVIDER: openrouter
      OPENROUTER_BASE_URL: http://fake-llm:9800/v1
      OPENROUTER_API_KEY: fake
      # LLM_FALLBACK_PROVIDER=qwen sends failed calls to fake-llm-backup.
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      QWEN_BASE_URL: http://fake-llm-backup:9800/v1
      QWEN_API_KEY: fake
      QWEN_MODEL: fake-backup-model
      # Processes, and threads per process that step the chat streams,
      # e.g. WEB_WORKERS=3 AI_STREAM_THREADS=10 to see what each one buys.
      WEB_WORKERS: ${WEB_WORKERS:-1}
      AI_STREAM_THREADS: ${AI_STREAM_THREADS:-40}
    volumes: !override
      - bench-data:/data

  postgres:
    volumes: !override
      - bench-postgres-data:/var/lib/postgresql/data

  fake-llm:
    environment:
      # "1" prints one line per provider call: how many calls a chat turn makes.
      FAKE_LLM_LOG: ${FAKE_LLM_LOG:-0}
      # e.g. 503: the primary fails every chat completion.
      FAKE_LLM_FAIL_STATUS: ${FAKE_LLM_FAIL_STATUS:-}

  # The fallback provider; only used with LLM_FALLBACK_PROVIDER=qwen.
  fake-llm-backup:
    profiles: ["bench"]
    image: python:3.12-slim
    command: ["python", "/app/tools/fake_llm/server.py"]
    environment:
      FAKE_LLM_LOG: ${FAKE_LLM_LOG:-0}
    volumes:
      - ./tools:/app/tools:ro

volumes:
  bench-data:
  bench-postgres-data:
