# Load-test overlay: points the api at the fake provider and keeps benchmark
# data in its own volumes (uploads and the postgres data directory), so
# hundreds of throwaway accounts never reach the dev database.
#
#   docker compose -f docker-compose.yml -f docker-compose.bench.yml --profile bench up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.bench.yml --profile bench down
#   docker volume rm carbonsnap_bench-data carbonsnap_bench-postgres-data
#
# Not `down -v`: that also deletes postgres-data, the dev database.
# See docs/benchmarks.md.

services:
  api:
    environment:
      LLM_PROVIDER: openrouter
      OPENROUTER_BASE_URL: http://fake-llm:9800/v1
      OPENROUTER_API_KEY: fake
      # e.g. GUNICORN_CMD_ARGS="--workers 12" to see what more workers buy.
      GUNICORN_CMD_ARGS: ${GUNICORN_CMD_ARGS:-}
    volumes: !override
      - bench-data:/data

  postgres:
    volumes: !override
      - bench-postgres-data:/var/lib/postgresql/data

  fake-llm:
    environment:
      # "1" prints one line per provider call: how many calls a chat turn makes.
      FAKE_LLM_LOG: ${FAKE_LLM_LOG:-0}

volumes:
  bench-data:
  bench-postgres-data:
